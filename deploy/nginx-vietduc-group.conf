# vietducgroup — Next.js 16 sau pm2 trên cổng 3500 (VPS OVH 57.129.45.199)
#
# Đặt vào /etc/nginx/sites-available/vietduc-group rồi liên kết sang
# sites-enabled. File này nằm trong repo vì cấu hình chỉ sống trên máy chủ là
# thứ sớm muộn cũng mất: bài học từ khối /vdg-media/ của itw-berlin.
#
# CHƯA CÓ KHỐI 443. Tên miền chưa trỏ về máy này nên chưa xin được chứng chỉ;
# khai 443 trước khi có file chứng chỉ là nginx không khởi động được. Khi tên
# miền về:
#
#   sudo certbot --nginx -d <ten-mien> -d www.<ten-mien>
#
# certbot tự chèn khối 443 và phần chuyển hướng vào file này.

server {
    # default_server: cho tới khi có tên miền, trang được truy cập bằng địa chỉ
    # IP trần, tức Host không khớp tên nào. itw-berlin.de khai server_name rõ
    # ràng nên vẫn nhận đúng phần của nó; chỉ những Host không khớp ai mới rơi
    # vào đây.
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Để Let's Encrypt lấy được file kiểm tra khi xin chứng chỉ.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Ảnh và tài liệu người dùng tải lên qua trang quản trị.
    client_max_body_size 25m;

    # Sản phẩm build là bất biến, cho phép giữ lâu.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3500;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Trợ lý tư vấn trả lời theo kiểu chảy dần; đệm lại là giữ mất câu trả lời.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
